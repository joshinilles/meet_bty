[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# MEET DAILY Studio (internes Aufnahme-Tool): Kamera und Mikrofon nur hier erlauben
[[headers]]
  for = "/studio/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/studio/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[functions]
  directory = "netlify/functions"
  # config.js liegt den Functions bei: die Antwort-Push liest dort den öffentlichen Push-Schlüssel (pushKey)
  included_files = ["config.js"]

# Service Worker (Push-Benachrichtigungen): nie lange zwischenspeichern, damit Änderungen sofort greifen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Abhängigkeiten der Functions (node_modules) sind nicht Teil der Website
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
